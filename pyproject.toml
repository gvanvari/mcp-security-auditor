[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-security-auditor"
version = "0.1.0"
description = "MCP supply chain security auditor — AST extraction + LLM reasoning + MITRE mapping"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0",
    "anthropic>=0.25",
    "pip-audit>=2.7",
    "click>=8.1",
    "pyyaml>=6.0",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[project.scripts]
mcp-auditor = "mcp_auditor.analyzer:main"
mcp-auditor-all = "mcp_auditor.analyzer:scan_all"

[tool.setuptools.packages.find]
where = ["."]
include = ["mcp_auditor*"]

[tool.setuptools.package-data]
mcp_auditor = ["kb/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
