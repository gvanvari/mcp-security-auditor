name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          pip install -e ".[dev]"

      - name: Run tests
        run: pytest tests/ -q --tb=short

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies + security tools
        run: pip install -e ".[dev]" bandit pip-audit

      - name: SAST — Bandit source scan
        run: bandit -r mcp_auditor/ -ll -q

      - name: SCA — pip-audit dependency scan
        # --skip-editable: the project itself is installed via `pip install -e .`
        # and has no PyPI release, so it can't be resolved; audit real deps only.
        # --strict is omitted deliberately: it fails on ANY skip (including our own
        # editable package), which contradicts --skip-editable. pip-audit still
        # exits non-zero if a real dependency has a known vulnerability.
        run: pip-audit --skip-editable
